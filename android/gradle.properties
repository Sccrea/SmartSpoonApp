org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=false

# JDK：这里**不写死路径**。之前那一版写的是 `.../Desktop/test/_tools/jdk17`（某台机器上的临时
# 工具链，仓库里根本没有这个目录），克隆到别的机器上会因为路径不存在直接构建失败。
# 现在统一走环境变量 JAVA_HOME，README 的构建一节也是这么写的。
#
# AGP 8.5.2 官方支持的 compileSdk 上限是 34，本机 SDK 只有 platform 36，
# 所以这里显式压掉"未测试过的 compileSdk"警告（只是警告，编译与运行都正常）。
android.suppressUnsupportedCompileSdk=36
